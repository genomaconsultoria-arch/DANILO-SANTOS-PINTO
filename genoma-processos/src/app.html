<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genoma Processos</title>
<link rel="icon" href="data:image/webp;base64,__LOGO_MARK__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fixa (navegação) + área de trabalho; no celular a navegação vira barra inferior.
   Identidade: padrão visual dos POPs Genoma (verde, laranja, RACI em verde/laranja/azul/roxo). */
:root{
  --bg:#f4f7f3; --surface:#ffffff; --surface-2:#edf3eb; --line:#d7e0d4; --fg:#1b281d; --muted:#5a685c;
  --brand:#2e7d32; --brand-d:#1b5e20; --brand-soft:#e2f0e2; --brand-text:#1f6b24; --on-brand:#ffffff;
  --orange:#e46d16; --orange-soft:#fdeedf; --blue:#1e7bc4; --blue-soft:#e3effa; --purple:#7b3fa8; --purple-soft:#f1e8f8;
  --red:#c62828; --red-soft:#fbe6e6; --amber:#93600f; --amber-soft:#fbf0d9;
  --side:#173f1a; --side-fg:#d9eadb; --side-active:#2e7d32;
  --shadow:0 1px 2px rgba(20,40,20,.06),0 6px 18px rgba(20,40,20,.06);
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#151c16; --surface-2:#1b261d; --line:#2a382c; --fg:#e4ebe4; --muted:#9aaa9c;
  --brand:#2e7d32; --brand-d:#1d4f20; --brand-soft:#1c3120; --brand-text:#7fcf83; --on-brand:#ffffff;
  --orange:#f08a3c; --orange-soft:#33231380; --blue:#62aee9; --blue-soft:#162a3a; --purple:#b78de2; --purple-soft:#2a1d36;
  --red:#ef7272; --red-soft:#3a1c1c; --amber:#e3b35c; --amber-soft:#342812;
  --side:#0b1a0d; --side-fg:#c6d9c8; --side-active:#2e7d32; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#151c16; --surface-2:#1b261d; --line:#2a382c; --fg:#e4ebe4; --muted:#9aaa9c;
  --brand:#2e7d32; --brand-d:#1d4f20; --brand-soft:#1c3120; --brand-text:#7fcf83; --on-brand:#ffffff;
  --orange:#f08a3c; --orange-soft:#33231380; --blue:#62aee9; --blue-soft:#162a3a; --purple:#b78de2; --purple-soft:#2a1d36;
  --red:#ef7272; --red-soft:#3a1c1c; --amber:#e3b35c; --amber-soft:#342812;
  --side:#0b1a0d; --side-fg:#c6d9c8; --side-active:#2e7d32; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
aside.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:14px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{background:#fff;border-radius:10px;padding:8px 10px}
.brand img{display:block;height:auto;width:100%}
.brand-sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-fg);opacity:.8;padding:0 6px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
.side nav a:hover{background:rgba(255,255,255,.07)}
.side nav a[aria-current="page"]{background:var(--side-active);color:#fff}
.side nav svg{width:18px;height:18px;flex:none}
.side nav .badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-variant-numeric:tabular-nums}
.side .sep{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;padding:8px 10px 2px}
.side-foot{margin-top:auto;font-size:12px;opacity:.75;padding:0 6px;display:flex;flex-direction:column;gap:6px}
.side-foot button{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--side-fg);border-radius:6px;padding:5px 8px;cursor:pointer;text-align:left}

.work{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top select,.top input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.top .search{flex:1;min-width:0;max-width:420px;position:relative}
.top .search input{width:100%;padding-left:32px}
.top .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:20}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface-2)}
.results small{color:var(--muted)}
.mobile-logo{display:none;height:28px;background:#fff;border-radius:6px;padding:2px 6px}
main{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:30;overflow-x:auto;gap:0}
  .brand,.brand-sub,.side .sep,.side-foot{display:none}
  .side nav{flex-direction:row;gap:2px}
  .side nav a{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:62px;text-align:center}
  .side nav .badge{position:absolute;margin:0;transform:translate(14px,-4px);font-size:9px}
  .side nav a{position:relative}
  main{padding-bottom:110px}
  .mobile-logo{display:block}
  .top .hide-sm{display:none}
  .cli-chip span{display:none}
  .top{flex-wrap:wrap;gap:8px}
  .top #empresa{flex:1;min-width:0}
  .top .search{order:5;flex-basis:100%;max-width:none}
  .mobile-logo{height:34px}
}
@media (max-width:560px){
  .top .cli-chip{display:none}
}

/* Elementos */
.page-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.page-head>div{flex:1;min-width:240px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.page-head h1{font-size:24px;color:var(--brand-text)}
.page-head p{margin:2px 0 0;color:var(--muted);max-width:68ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.green{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--red)}
.btn.small{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.grid-2{grid-template-columns:1fr}}
@media (max-width:760px){.grid-3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>h3,.panel-h{font-size:14px;color:var(--brand-text);display:flex;align-items:center;gap:8px}
.panel-h .grow{flex:1}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-size:12px;font-family:var(--f-display);flex:none}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;color:var(--brand-text);line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--red)}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stage{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left;cursor:pointer}
.stage:hover{outline:1px solid var(--brand)}
.stage b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--brand-text)}
.stage span{font-size:12px;color:var(--muted)}
.stage.ia{background:var(--orange-soft)} .stage.ia b{color:var(--orange)}
@media (max-width:640px){.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepper{display:flex;gap:4px}
.stepper i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepper i.on{background:var(--brand)}
.stepper i.on.last{background:var(--orange)}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kind{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px;white-space:nowrap}
.k-decisao{background:var(--purple-soft);color:var(--purple)}
.k-delegacao{background:var(--blue-soft);color:var(--blue)}
.k-processo{background:var(--brand-soft);color:var(--brand-text)}
.k-treinamento{background:var(--amber-soft);color:var(--amber)}
.k-melhoria{background:var(--orange-soft);color:var(--orange)}
.k-automacao{background:var(--fg);color:var(--bg)}
.k-equipe{background:var(--surface-2);color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.s-afazer,.t-pendente,.m-ideia{background:var(--surface-2);color:var(--muted)}
.s-andamento,.m-testando{background:var(--blue-soft);color:var(--blue)}
.s-aguardando,.t-retreinar{background:var(--amber-soft);color:var(--amber)}
.s-concluida,.t-concluido,.m-aprovada{background:var(--brand-soft);color:var(--brand-text)}
.m-descartada{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.late,.t-reprovado{background:var(--red-soft);color:var(--red)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;text-align:left}
.card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.card h3{font-size:15px}
.code{font-family:var(--f-display);font-size:12px;font-weight:600;color:var(--orange);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.card-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px;align-items:center}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:120px}
.col.drop{outline:2px dashed var(--brand)}
.col>header{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);cursor:grab}
.task.is-late{border-color:var(--red)}
.task h4{margin:0;font-size:14px;font-family:var(--f-body);font-weight:600}
.task .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.task select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px}
.auto-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:600}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.dec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:14px}
.dec .date{font-family:var(--f-display);text-align:center;color:var(--purple);line-height:1.1}
.dec .date b{display:block;font-size:24px}
.dec .date span{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.dec h3{font-size:15px}
.dec p{margin:4px 0 8px}

/* POP */
.pop{background:var(--surface);border:2px solid var(--brand);border-radius:12px;overflow:hidden}
.pop-head{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) minmax(110px,170px) auto;border-bottom:2px solid var(--brand)}
.pop-head>div+div{border-left:2px solid var(--brand)}
.pop-logo{display:grid;place-items:center;background:#fff}
.pop-logo img{max-height:64px;max-width:100%;width:auto;display:block}
.pop-logo .nome-cli{font-family:var(--f-display);font-weight:700;color:#1b5e20;text-align:center;font-size:16px}
.pop-center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--surface-2)}
.cli-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;height:38px;cursor:pointer}
.cli-chip img{max-height:30px;max-width:110px;width:auto;display:block}
.cli-chip span{font-size:12px;color:#5a685c;white-space:nowrap}
.logo-drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.logo-drop.over{border-color:var(--orange)}
.logo-prev{width:220px;height:90px;background:#fff;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden;flex:none}
.logo-prev img{max-width:200px;max-height:76px}
.dupla{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dupla .chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;place-items:center;height:56px}
.dupla .chip img{max-height:44px;max-width:180px;width:auto}
.pop-head>div{padding:12px 16px}
.pop-head .meta{font-size:12px;min-width:200px;display:flex;flex-direction:column;gap:3px}
.pop-head .meta div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line)}
.pop-title{background:var(--brand);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center}
.pop-title h2{font-size:17px}
.tag{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pop-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.pop-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px}
.pop-info div{padding:8px 12px;border-left:1px solid var(--line);min-width:0}
.pop-info div:first-child{border-left:0}
.pop-info small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.pop-head{grid-template-columns:1fr 1fr}.pop-head .pop-center{grid-column:1/-1;grid-row:1}.pop-head>div+div{border-left:0}.pop-head>div{border-top:2px solid var(--brand)}.pop-head .pop-center{border-top:0}.pop-head .meta{grid-column:1/-1}}
@media (max-width:640px){.pop-info{grid-template-columns:1fr}.pop-info div{border-left:0;border-top:1px solid var(--line)}.pop-info div:first-child{border-top:0}}
.sec-h{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-text);display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--line);padding-bottom:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:var(--brand-d);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
td.n{font-weight:600;color:var(--brand-text);font-variant-numeric:tabular-nums;width:48px}
td.c{text-align:center;width:72px}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700}
.d-R{background:var(--brand)} .d-A{background:var(--orange)} .d-C{background:var(--blue)} .d-I{background:var(--purple)}
th.h-R{background:var(--brand)} th.h-A{background:var(--orange)} th.h-C{background:var(--blue)} th.h-I{background:var(--purple)}
.who-cell{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.tipo{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--brand-soft);color:var(--brand-text)}
.tipo.dec-t{background:var(--orange-soft);color:var(--orange)}
.flow-wrap{border:1px solid var(--line);border-radius:10px;overflow-x:auto;padding:10px;background:var(--surface)}
.flow-wrap svg{display:block;margin:0 auto}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.signs div{border-top:1.5px solid var(--fg);text-align:center;font-size:12px;padding-top:4px}
.pop-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid var(--brand);padding:10px 16px;font-size:11px;color:var(--muted)}
.pop-foot img{height:30px;width:auto}

.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand)}

/* Editor */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.fields,.fields.three{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.steps-ed{display:flex;flex-direction:column;gap:8px}
.step-ed{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--surface-2);border-radius:10px;padding:10px}
.step-ed .n{font-family:var(--f-display);font-weight:700;color:var(--brand-text);padding-top:7px;text-align:center}
.step-ed .inner{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px}
.step-ed .inner .full{grid-column:1/-1}
.step-ed .raci-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step-ed input,.step-ed select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.step-ed .tools{display:flex;flex-direction:column;gap:4px}
.step-ed .tools button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:28px;cursor:pointer}
.mini-l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){.step-ed .inner{grid-template-columns:1fr}.step-ed .raci-in{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tpl{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.tpl:hover{border-color:var(--orange)}
.tpl b{font-family:var(--f-display);font-size:14px}

/* Checklist de maturidade */
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check-list li{display:flex;gap:10px;align-items:flex-start}
.ck{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.ck.ok{background:var(--brand);color:#fff}
.ck.no{border:2px solid var(--line)}

/* Treinamento */
.matrix th,.matrix td{text-align:center;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.matrix thead th:first-child{background:var(--brand-d)}
.cell{border:0;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-weight:500}
.study{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.study-card{background:var(--surface);border:2px solid var(--brand);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.study-card .big{font-family:var(--f-display);font-size:20px}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange)}
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer}
.quiz-opt:hover{border-color:var(--brand)}
.quiz-opt.right{border-color:var(--brand);background:var(--brand-soft)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft)}

/* Automações */
.autos{display:flex;flex-direction:column;gap:10px}
.auto{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.auto .when{font-size:12px;color:var(--muted)}
.auto .when b{color:var(--blue)}
.auto .then b{color:var(--orange)}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--orange);outline-offset:2px}

dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,10,.5)}
.dlg-head{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1}
.dlg-head h2{font-size:16px;flex:1}
.dlg-head .x{background:#fff;color:#1b5e20;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600}
.dlg-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--orange-soft);border-radius:10px;padding:10px 12px}
.toasts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:min(420px,calc(100vw - 32px));z-index:60;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast button{background:transparent;border:0;color:var(--orange);font-weight:600;cursor:pointer}
.toast.auto{background:var(--orange);color:#fff}
@media (max-width:860px){.toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:16px;right:16px;align-items:center;max-width:none}}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:240px;z-index:25;display:flex;flex-direction:column}
.menu-list button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column}
.menu-list button:hover,.menu-list button:focus{background:var(--surface-2)}
.menu-list small{color:var(--muted)}
.guide{background:linear-gradient(0deg,var(--surface),var(--surface));border:1px solid var(--orange);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.guide h3{grid-column:1/-1;font-size:15px}
.guide div{display:flex;flex-direction:column;gap:4px}
.guide b{font-family:var(--f-display);color:var(--orange)}
@media (max-width:760px){.guide{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000}
  aside.side,.top,.no-print,.subtabs,.toasts{display:none!important}
  .app{display:block} main{padding:0;max-width:none}
  .pop{border-color:#2e7d32}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegação">
    <div class="brand"><img src="data:image/webp;base64,__LOGO_H__" alt="Genoma Consultoria"></div>
    <div class="brand-sub">Processos · Melhoria · Treinamento</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button type="button" id="b-export">Baixar cópia de segurança</button>
      <button type="button" id="b-import">Restaurar cópia</button>
      <input type="file" id="f-import" accept="application/json" hidden>
      <span>Dados salvos neste navegador.</span>
    </div>
  </aside>
  <div class="work">
    <header class="top">
      <img class="mobile-logo" src="data:image/webp;base64,__LOGO_H__" alt="Genoma Consultoria">
      <label class="hide-sm muted small" for="empresa">Cliente</label>
      <select id="empresa" aria-label="Cliente"></select>
      <button type="button" class="cli-chip" id="cli-chip" data-act="config-cliente" title="Logo e dados do cliente"></button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar processo, pessoa, tarefa…  ( / )" autocomplete="off" aria-label="Buscar">
        <div class="results" id="resultados" hidden></div>
      </div>
      <div class="menu">
        <button class="btn primary" id="b-criar" aria-haspopup="true" aria-expanded="false">+ Criar</button>
        <div class="menu-list" id="menu-criar" hidden>
          <button data-act="novo-processo"><b>Processo (POP)</b><small>Do zero ou a partir de um modelo</small></button>
          <button data-act="nova-decisao"><b>Decisão</b><small>Registra e já delega a execução</small></button>
          <button data-act="nova-delegacao"><b>Delegação</b><small>Tarefa com processo e responsável</small></button>
          <button data-act="nova-melhoria"><b>Ideia de melhoria</b><small>Sugestão para um processo</small></button>
          <button data-act="nova-pessoa"><b>Pessoa</b><small>Adicionar à equipe do cliente</small></button>
        </div>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<datalist id="dl-pessoas"></datalist><datalist id="dl-cargos"></datalist><datalist id="dl-deptos"></datalist>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================
   Genoma Processos — criação, melhoria e treinamento em processos
   Dados ficam no navegador (localStorage). Cópia de segurança em JSON.
   ========================================================= */
const LOGO_MARK="data:image/webp;base64,__LOGO_MARK__";
const LOGO_H="data:image/webp;base64,__LOGO_H__";
const CHAVE="genoma-processos-v1";
const FASES=["Levantamento","POP documentado","Implantado e treinado","Medição e melhoria","Pronto para IA"];
const STATUS=[["afazer","A fazer"],["andamento","Em andamento"],["aguardando","Aguardando"],["concluida","Concluída"]];
const MELH=[["ideia","Ideia"],["testando","Testando"],["aprovada","Aprovada"],["descartada","Descartada"]];
const NOTA_MIN=70;

const AUTOMACOES=[
  {id:"decisao-delega",quando:"Uma decisão é registrada",entao:"Cria a delegação para o responsável, ligada ao processo afetado",padrao:true},
  {id:"novo-processo-treino",quando:"Um processo é criado",entao:"Cria treinamento pendente para todas as pessoas com o cargo executor",padrao:true},
  {id:"versao-retreino",quando:"Um processo ganha nova versão",entao:"Marca para retreinar quem já tinha sido treinado e avisa no mural",padrao:true},
  {id:"treino-resultado",quando:"Uma avaliação de treinamento é concluída",entao:`Com nota a partir de ${NOTA_MIN}% registra colaborador treinado. Abaixo disso, marca para refazer`,padrao:true},
  {id:"fase-treinado",quando:"Todos os executores de um POP documentado são treinados",entao:"Avança o processo para a fase Implantado e treinado",padrao:true},
  {id:"indicador-melhoria",quando:"Uma medição fica fora da meta",entao:"Abre uma ideia de melhoria e delega a análise ao executor",padrao:true},
  {id:"atraso-aviso",quando:"Uma delegação passa do prazo",entao:"Destaca como atrasada e registra o aviso no mural",padrao:true},
  {id:"revisao-periodica",quando:"Um processo chega na data de revisão",entao:"Cria a tarefa de revisar o POP para quem reporta",padrao:true,param:{nome:"diasRevisao",label:"Revisar a cada (dias)",valor:180}}
];

const MODELOS=[
  {nome:"Requisição e compra de peças",depto:"Compras",obj:"Garantir peças disponíveis sem excesso de estoque.",etapas:["Verificar estoque mínimo","Criar requisição de peças","Cotar com ao menos 3 fornecedores","Peça é estratégica ou acima do limite?|decisao|Comprar direto com melhor cotação","Aprovar compra com a diretoria","Emitir pedido de compra","Conferir recebimento e lançar no estoque"]},
  {nome:"Atendimento e orçamento ao cliente",depto:"Vendas",obj:"Atender o cliente com rapidez e transformar orçamento em venda.",etapas:["Receber o cliente e registrar a demanda","Avaliar o veículo","Montar orçamento de peças e serviços","Cliente aprovou?|decisao|Registrar motivo e agendar retorno em 3 dias","Abrir ordem de serviço","Informar prazo de entrega ao cliente"]},
  {nome:"Ordem de serviço no pátio",depto:"Operações",obj:"Executar o serviço no prazo combinado e com qualidade.",etapas:["Receber a OS e conferir peças","Distribuir tarefa ao mecânico","Executar o serviço","Teste de qualidade aprovado?|decisao|Voltar ao mecânico com o apontamento","Encaminhar peças e serviços para faturamento","Avisar o cliente para retirada"]},
  {nome:"Faturamento",depto:"Financeiro",obj:"Faturar corretamente tudo o que foi executado.",etapas:["Receber lista de peças e serviços","Conferir com a OS","Valores conferem?|decisao|Devolver ao líder para correção","Emitir nota fiscal","Registrar forma de pagamento","Arquivar documentos"]},
  {nome:"Cadastro de cliente",depto:"Cadastros",obj:"Manter a base de clientes completa e sem duplicidade.",etapas:["Buscar cliente pelo CPF/CNPJ","Cliente já existe?|decisao|Criar novo cadastro","Atualizar telefone, e-mail e veículos","Conferir dados com o cliente"]},
  {nome:"Integração de novo colaborador",depto:"Pessoas",obj:"Deixar o novo colaborador produtivo e seguro na primeira semana.",etapas:["Preparar acessos e uniforme","Apresentar a empresa e a equipe","Treinar nos POPs do cargo","Acompanhar a primeira semana","Avaliar adaptação em 30 dias"]}
];

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const hojeISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const somaDias=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmtData=iso=>{if(!iso)return"—";const[y,m,d]=iso.slice(0,10).split("-");return`${d}/${m}/${y}`};
const fmtQuando=iso=>{if(!iso)return"";const d=new Date(iso);return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const iniciais=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Armazenamento ---------- */
let D;
function dadosIniciais(){
  const emp="mega-freio";
  const p1={id:uid(),empresaId:emp,codigo:"POP-OPE-01",nome:"Controle de Produção",depto:"Operações",cargoExecutor:"Líder Operacional",reportaA:"Sócio-Diretor",
    objetivo:"Controle de Produção",fase:1,versao:1,emissao:"2026-10-13",revisarEm:somaDias("2026-10-13",180),raci:{R:"Líder Operacional",A:"",C:"",I:""},
    etapas:[["Diariamente verificar no estoque necessidade de reposição"],["Criar lista de requisição de peças"],["Distribuir lista para equipe"],["Verificar entrega da equipe"]].map(([d])=>({id:uid(),desc:d,tipo:"acao",seNao:"",R:"Líder Operacional",A:"",C:"",I:""})),
    historico:[{versao:1,data:"2026-10-13",nota:"Emissão inicial do POP"}],indicadores:[],melhorias:[]};
  const p2={id:uid(),empresaId:emp,codigo:"POP-DIR-02",nome:"Controle de Pátio",depto:"Diretoria",cargoExecutor:"Líder Operacional",reportaA:"Sócio-Diretor",
    objetivo:"Controle de Pátio",fase:1,versao:1,emissao:"2026-10-13",revisarEm:somaDias("2026-10-13",180),raci:{R:"Líder Operacional",A:"",C:"",I:""},
    etapas:["Diariamente coordenar demanda de clientes de pátio","Distribuir tarefas para mecânicos","Acompanhar soluções","Encaminhar lista de peças e serviços para faturamento"].map(d=>({id:uid(),desc:d,tipo:"acao",seNao:"",R:"",A:"",C:"",I:""})),
    historico:[{versao:1,data:"2026-10-13",nota:"Emissão inicial do POP"}],indicadores:[],melhorias:[]};
  const dec={id:uid(),empresaId:emp,data:"2026-11-11",titulo:"Criar gestor de processos com canal de decisões e delegações",
    descricao:"Toda decisão sobre delegação de tarefas deve informar o processo a ser executado e a pessoa responsável, em um lugar visível e de fácil acesso, para as pontas se conversarem melhor.",
    decididoPor:"Danilo e Isaura Gondek",processoId:"",responsavel:"Danilo",prazo:""};
  const del={id:uid(),empresaId:emp,titulo:dec.titulo,processoId:"",etapa:"",responsavel:"Danilo",prazo:"",delegadoPor:dec.decididoPor,status:"andamento",obs:dec.descricao,decisaoId:dec.id,auto:true};
  return {versao:1,empresaAtual:emp,empresas:[{id:emp,nome:"Mega Freio"}],
    pessoas:[{id:uid(),empresaId:emp,nome:"Isaura Gondek",cargo:"",depto:"",empresa:"Cliente"},{id:uid(),empresaId:emp,nome:"Danilo",cargo:"Consultor",depto:"",empresa:"Genoma"}],
    processos:[p1,p2],decisoes:[dec],delegacoes:[del],treinamentos:[],
    automacoes:Object.fromEntries(AUTOMACOES.map(a=>[a.id,{ativa:a.padrao,...(a.param?{[a.param.nome]:a.param.valor}:{})}])),
    mural:[{id:uid(),empresaId:emp,em:"2026-11-11T13:08:00",tipo:"decisao",texto:"Danilo e Isaura Gondek decidiram: criar gestor de processos com canal de decisões e delegações. Responsável: Danilo"},
           {id:uid(),empresaId:emp,em:"2026-10-13T15:19:00",tipo:"processo",texto:"POP-DIR-02 · Controle de Pátio emitido (versão 1)"},
           {id:uid(),empresaId:emp,em:"2026-10-13T15:15:00",tipo:"processo",texto:"POP-OPE-01 · Controle de Produção emitido (versão 1)"}]};
}
function carregar(){
  try{const raw=localStorage.getItem(CHAVE);if(raw){D=JSON.parse(raw);}}catch(e){}
  if(!D||!D.empresas){D=dadosIniciais();salvar(true)}
  for(const a of AUTOMACOES)if(!D.automacoes[a.id])D.automacoes[a.id]={ativa:a.padrao,...(a.param?{[a.param.nome]:a.param.valor}:{})};
}
function salvar(silencioso){try{localStorage.setItem(CHAVE,JSON.stringify(D))}catch(e){if(!silencioso)toast("Não foi possível salvar neste navegador. Baixe uma cópia de segurança.")}}

/* ---------- Acesso por empresa ---------- */
const E=()=>D.empresaAtual;
const doCliente=lista=>lista.filter(x=>x.empresaId===E());
const processos=()=>doCliente(D.processos).sort((a,b)=>(a.codigo||a.nome).localeCompare(b.codigo||b.nome));
const pessoas=()=>doCliente(D.pessoas).sort((a,b)=>a.nome.localeCompare(b.nome));
const delegacoes=()=>doCliente(D.delegacoes);
const decisoes=()=>doCliente(D.decisoes).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
const treinamentos=()=>doCliente(D.treinamentos);
const mural=()=>doCliente(D.mural).sort((a,b)=>b.em.localeCompare(a.em));
const proc=id=>D.processos.find(p=>p.id===id);
const procNome=id=>{const p=proc(id);return p?`${p.codigo?p.codigo+" · ":""}${p.nome}`:""};
const pessoa=id=>D.pessoas.find(p=>p.id===id);
const atrasada=t=>t.status!=="concluida"&&t.prazo&&t.prazo<hojeISO();
const statusNome=k=>(STATUS.find(s=>s[0]===k)||STATUS[0])[1];
const ativa=id=>D.automacoes[id]?.ativa;

function registrar(tipo,texto){D.mural.push({id:uid(),empresaId:E(),em:new Date().toISOString(),tipo,texto});if(D.mural.length>3000)D.mural.splice(0,D.mural.length-3000)}

/* ---------- Toasts ---------- */
function toast(msg,{auto=false,desfazer=null}={}){
  const t=document.createElement("div");t.className="toast"+(auto?" auto":"");t.textContent=msg;
  if(desfazer){const b=document.createElement("button");b.textContent="Desfazer";b.onclick=()=>{desfazer();t.remove()};t.appendChild(b)}
  const box=$("#toasts");box.appendChild(t);while(box.children.length>3)box.firstElementChild.remove();setTimeout(()=>t.remove(),desfazer?7000:3200);
}
function autoAviso(texto){registrar("automacao",texto);toast("⚙ "+texto,{auto:true})}

/* ---------- Motor de automações ---------- */
function codigoNovo(depto){
  const sig=norm(depto||"GER").replace(/[^a-z]/g,"").slice(0,3).toUpperCase()||"GER";
  const n=processos().length+1;return `POP-${sig}-${String(n).padStart(2,"0")}`;
}
function executores(p){
  const cargos=new Set([p.cargoExecutor,...(p.etapas||[]).map(e=>e.R)].filter(Boolean).map(norm));
  return pessoas().filter(x=>cargos.has(norm(x.cargo))||cargos.has(norm(x.nome)));
}
function garantirTreino(p,pes,status="pendente"){
  let t=D.treinamentos.find(x=>x.processoId===p.id&&x.pessoaId===pes.id);
  if(!t){t={id:uid(),empresaId:p.empresaId,processoId:p.id,pessoaId:pes.id,status,nota:null,data:null,versao:null,tentativas:0};D.treinamentos.push(t);return true}
  return false;
}
function novaDelegacao(dados,motivo){
  const t={id:uid(),empresaId:E(),status:"afazer",etapa:"",obs:"",prazo:"",delegadoPor:"Automação Genoma",auto:true,...dados};
  D.delegacoes.push(t);return t;
}
const AUTO={
  "decisao.criada"(dec){
    if(!ativa("decisao-delega")||!dec.responsavel)return;
    novaDelegacao({titulo:dec.titulo,processoId:dec.processoId,responsavel:dec.responsavel,prazo:dec.prazo,delegadoPor:dec.decididoPor,obs:dec.descricao,decisaoId:dec.id});
    autoAviso(`Decisão virou tarefa para ${dec.responsavel}`);
  },
  "processo.criado"(p){
    if(!ativa("novo-processo-treino"))return;
    let n=0;executores(p).forEach(x=>{if(garantirTreino(p,x))n++});
    if(n)autoAviso(`${n} treinamento(s) criado(s) para ${p.codigo||p.nome}`);
  },
  "processo.versao"(p){
    if(!ativa("versao-retreino"))return;
    let n=0;D.treinamentos.filter(t=>t.processoId===p.id&&t.status==="concluido").forEach(t=>{t.status="retreinar";n++});
    executores(p).forEach(x=>garantirTreino(p,x));
    if(n)autoAviso(`${p.codigo||p.nome} mudou para v${p.versao}: ${n} pessoa(s) marcada(s) para retreinar`);
  },
  "treino.avaliado"(t){
    const p=proc(t.processoId),x=pessoa(t.pessoaId);
    if(ativa("treino-resultado")){
      if(t.nota>=NOTA_MIN){t.status="concluido";t.data=hojeISO();t.versao=p.versao;autoAviso(`${x?.nome} treinado em ${p.codigo||p.nome} (${t.nota}%)`)}
      else{t.status="reprovado";autoAviso(`${x?.nome} fez ${t.nota}% em ${p.codigo||p.nome}. Precisa refazer`)}
    }else{t.status=t.nota>=NOTA_MIN?"concluido":"reprovado";t.data=hojeISO();t.versao=p.versao}
    AUTO["checar.fase"](p);
  },
  "checar.fase"(p){
    if(!ativa("fase-treinado")||(p.fase??0)!==1)return;
    const ex=executores(p);if(!ex.length)return;
    const ok=ex.every(x=>D.treinamentos.some(t=>t.processoId===p.id&&t.pessoaId===x.id&&t.status==="concluido"));
    if(ok){p.fase=2;autoAviso(`${p.codigo||p.nome} avançou para Implantado e treinado`)}
  },
  "indicador.medido"(p,ind,valor){
    if(!ativa("indicador-melhoria")||ind.meta===""||ind.meta==null)return;
    const fora=ind.sentido==="menor"?valor>Number(ind.meta):valor<Number(ind.meta);
    if(!fora)return;
    p.melhorias.push({id:uid(),titulo:`Analisar ${ind.nome}: ${valor}${ind.unidade||""} (meta ${ind.meta}${ind.unidade||""})`,descricao:"Aberta automaticamente porque a medição ficou fora da meta.",status:"ideia",autor:"Automação Genoma",data:hojeISO(),auto:true});
    if(p.cargoExecutor)novaDelegacao({titulo:`Analisar causa: ${ind.nome} fora da meta`,processoId:p.id,responsavel:p.cargoExecutor,prazo:somaDias(hojeISO(),7)});
    autoAviso(`${ind.nome} fora da meta: melhoria aberta em ${p.codigo||p.nome}`);
  },
  rotina(){
    let mudou=false;
    if(ativa("atraso-aviso")){
      delegacoes().filter(t=>atrasada(t)&&!t.avisoAtraso).forEach(t=>{t.avisoAtraso=true;registrar("automacao",`Atrasada: "${t.titulo}" (${t.responsavel}, prazo ${fmtData(t.prazo)})`);mudou=true});
    }
    if(ativa("revisao-periodica")){
      processos().filter(p=>p.revisarEm&&p.revisarEm<=hojeISO()&&p.revisaoPedida!==p.revisarEm).forEach(p=>{
        p.revisaoPedida=p.revisarEm;
        novaDelegacao({titulo:`Revisar o POP ${p.codigo||p.nome}`,processoId:p.id,responsavel:p.reportaA||p.cargoExecutor||"Sem responsável",prazo:somaDias(hojeISO(),15)});
        registrar("automacao",`Revisão periódica: tarefa criada para revisar ${p.codigo||p.nome}`);mudou=true;
      });
    }
    if(mudou)salvar();return mudou;
  }
};

/* ---------- Maturidade e próximos passos ---------- */
function maturidade(p){
  const ex=executores(p);
  const tr=ex.length&&ex.every(x=>D.treinamentos.some(t=>t.processoId===p.id&&t.pessoaId===x.id&&t.status==="concluido"));
  const etapas=p.etapas||[];
  const med=(p.indicadores||[]).some(i=>(i.medicoes||[]).some(m=>m.data>=somaDias(hojeISO(),-45)));
  const itens=[
    {ok:!!(p.objetivo&&norm(p.objetivo)!==norm(p.nome)),txt:"Objetivo descreve o resultado esperado",dica:"Escreva o objetivo como resultado, não só o nome do processo. Ex.: \"Garantir peças disponíveis sem excesso de estoque\"."},
    {ok:!!p.cargoExecutor&&!!p.reportaA,txt:"Executor e liderança definidos",dica:"Defina quem executa e a quem reporta."},
    {ok:etapas.length>=3,txt:"Passo a passo com ao menos 3 etapas",dica:"Detalhe o passo a passo em ações observáveis."},
    {ok:etapas.length>0&&etapas.every(e=>e.R),txt:"Toda etapa tem um responsável (R)",dica:`Marque o responsável (R) em ${etapas.filter(e=>!e.R).length} etapa(s) sem dono.`},
    {ok:!!(p.raci?.A&&(p.raci?.C||p.raci?.I)),txt:"Matriz RACI com aprovador e informados",dica:"Indique quem aprova (A) e quem precisa ser consultado (C) ou informado (I)."},
    {ok:ex.length>0,txt:"Pessoas da equipe ligadas ao cargo executor",dica:`Cadastre na Equipe quem ocupa o cargo "${p.cargoExecutor||"executor"}" para treinar.`},
    {ok:!!tr,txt:"Executores treinados na versão atual",dica:"Treine os executores e aplique a avaliação."},
    {ok:(p.indicadores||[]).length>0,txt:"Indicador com meta definido",dica:"Crie um indicador com meta (ex.: % de entregas no prazo)."},
    {ok:med,txt:"Medição nos últimos 45 dias",dica:"Registre a medição mais recente do indicador."}
  ];
  const pct=Math.round(itens.filter(i=>i.ok).length/itens.length*100);
  return {itens,pct};
}

/* ---------- Diálogos ---------- */
function campo(f){
  const v=esc(f.value??"");const cls="field"+(f.full?" full":"");
  let input;
  if(f.type==="select")input=`<select id="f-${f.name}" name="${f.name}">${f.options.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(val)===String(f.value??"")?" selected":""}>${esc(lab)}</option>`}).join("")}</select>`;
  else if(f.type==="textarea")input=`<textarea id="f-${f.name}" name="${f.name}" ${f.required?"required":""} placeholder="${esc(f.ph||"")}">${v}</textarea>`;
  else input=`<input id="f-${f.name}" name="${f.name}" type="${f.type||"text"}" value="${v}" ${f.list?`list="${f.list}"`:""} ${f.required?"required":""} ${f.step?`step="${f.step}"`:""} placeholder="${esc(f.ph||"")}" autocomplete="off">`;
  return `<div class="${cls}"><label for="f-${f.name}">${esc(f.label)}${f.required?" *":""}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
}
function fecharDlg(){const d=$("#dlg");if(d.open)d.close()}
function abrirForm({titulo,tag,fields=[],extra="",corpo=null,salvar="Salvar",excluir,onSubmit,largo}){
  const form=$("#dlgForm");$("#dlg").style.width=largo?"min(940px,calc(100vw - 24px))":"";
  form.innerHTML=`<div class="dlg-head">${tag?`<span class="tag">${esc(tag)}</span>`:""}<h2>${esc(titulo)}</h2><button type="button" class="x" data-close>Fechar</button></div>
  <div class="dlg-body">${corpo??`<div class="fields">${fields.map(campo).join("")}</div>`}${extra}</div>
  ${onSubmit?`<div class="dlg-foot">${excluir?`<button type="button" class="btn danger" data-del style="margin-right:auto">Excluir</button>`:""}<button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn primary">${esc(salvar)}</button></div>`:""}`;
  form.onsubmit=ev=>{ev.preventDefault();if(!onSubmit)return;const fd=Object.fromEntries(new FormData(form).entries());
    for(const k in fd)if(typeof fd[k]==="string")fd[k]=fd[k].trim();
    if(onSubmit(fd,form)!==false){fecharDlg();salvar_e_render()}};
  form.querySelectorAll("[data-close]").forEach(b=>b.onclick=fecharDlg);
  if(excluir){let armado=false;const b=form.querySelector("[data-del]");b.onclick=()=>{if(!armado){armado=true;b.textContent="Clique de novo para excluir";return}excluir();fecharDlg();salvar_e_render()}}
  $("#dlg").showModal();
  const first=form.querySelector(".dlg-body input,.dlg-body select,.dlg-body textarea");if(first)first.focus();
}
function salvar_e_render(){salvar();render()}
function excluirCom(lista,item,rotulo){
  const i=lista.indexOf(item);if(i<0)return;lista.splice(i,1);
  toast(`${rotulo} excluído(a).`,{desfazer:()=>{lista.splice(i,0,item);salvar_e_render()}});
}

async function lerLogo(file){
  if(!file||!/^image\//.test(file.type))throw new Error("tipo");
  if(file.size>8*1024*1024)throw new Error("grande");
  const url=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(file)});
  if(file.type==="image/svg+xml")return url.length<300000?url:Promise.reject(new Error("grande"));
  const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=url});
  const max=480,esc_=Math.min(1,max/img.width,200/img.height);
  const c=document.createElement("canvas");c.width=Math.round(img.width*esc_);c.height=Math.round(img.height*esc_);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  let out=c.toDataURL("image/png");if(out.length>350000)out=c.toDataURL("image/webp",.9);
  return out;
}

/* Fluxograma em SVG */
function fluxograma(p){
  const et=p.etapas||[];const W=560,cx=220,bw=260,gap=26;let y=14;const parts=[];const fg="var(--fg)",mut="var(--muted)";
  const wrap=(s,max)=>{const w=String(s).split(/\s+/);const l=[];let c="";w.forEach(x=>{if((c+" "+x).trim().length>max){if(c)l.push(c);c=x}else c=(c+" "+x).trim()});if(c)l.push(c);return l.slice(0,4)};
  const term=(txt)=>{parts.push(`<rect x="${cx-60}" y="${y}" width="120" height="32" rx="16" fill="#2e7d32"/><text x="${cx}" y="${y+21}" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">${txt}</text>`);y+=32};
  const seta=()=>{parts.push(`<line x1="${cx}" y1="${y}" x2="${cx}" y2="${y+gap-6}" stroke="${mut}" stroke-width="1.6"/><path d="M${cx-5} ${y+gap-8} L${cx} ${y+gap} L${cx+5} ${y+gap-8}z" fill="${mut}"/>`);y+=gap};
  term("Início");
  et.forEach((e,i)=>{seta();const l=wrap(e.desc,e.tipo==="decisao"?24:34);
    if(e.tipo==="decisao"){const h=Math.max(70,l.length*15+34);const hw=bw/2+10;
      parts.push(`<path d="M${cx} ${y} L${cx+hw} ${y+h/2} L${cx} ${y+h} L${cx-hw} ${y+h/2}z" fill="var(--orange-soft)" stroke="var(--orange)" stroke-width="1.5"/>`);
      l.forEach((s,k)=>parts.push(`<text x="${cx}" y="${y+h/2-(l.length-1)*7.5+k*15+4}" text-anchor="middle" fill="${fg}" font-size="12">${esc(s)}</text>`));
      parts.push(`<text x="${cx-hw+6}" y="${y+12}" fill="var(--orange)" font-size="10" font-weight="700">${i+1}</text>`);
      if(e.seNao){const nl=wrap(e.seNao,22);const bx=cx+hw+30;const by=y+h/2-((nl.length*14+16)/2);
        parts.push(`<line x1="${cx+hw}" y1="${y+h/2}" x2="${bx}" y2="${y+h/2}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${cx+hw+6}" y="${y+h/2-5}" fill="var(--red)" font-size="10" font-weight="700">NÃO</text>`);
        parts.push(`<rect x="${bx}" y="${by}" width="${W-bx-6}" height="${nl.length*14+16}" rx="8" fill="var(--red-soft)" stroke="var(--red)"/>`);
        nl.forEach((s,k)=>parts.push(`<text x="${bx+8}" y="${by+20+k*14}" fill="${fg}" font-size="11">${esc(s)}</text>`));}
      parts.push(`<text x="${cx+6}" y="${y+h+14}" fill="var(--brand-text)" font-size="10" font-weight="700">SIM</text>`);
      y+=h;
    }else{const h=Math.max(40,l.length*15+16);
      parts.push(`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="8" fill="var(--brand-soft)" stroke="var(--brand)" stroke-width="1.5"/>`);
      l.forEach((s,k)=>parts.push(`<text x="${cx}" y="${y+h/2-(l.length-1)*7.5+k*15+4}" text-anchor="middle" fill="${fg}" font-size="12">${esc(s)}</text>`));
      parts.push(`<text x="${cx-bw/2+6}" y="${y+12}" fill="var(--brand-text)" font-size="10" font-weight="700">${i+1}</text>`);
      if(e.R)parts.push(`<text x="${cx+bw/2+8}" y="${y+h/2+4}" fill="${mut}" font-size="10">${esc(e.R)}</text>`);
      y+=h;}
  });
  seta();term("Fim");
  return `<svg viewBox="0 0 ${W} ${y+10}" width="${W}" height="${y+10}" role="img" aria-label="Fluxograma do processo" font-family="Inter,system-ui,sans-serif">${parts.join("")}</svg>`;
}

/* Treinamento */
function gerarQuiz(p){
  const et=(p.etapas||[]).filter(e=>e.desc);const qs=[];const pref=(p.codigo||"").match(/(\d+)$/)?.[1]?.replace(/^0+/,"")||"";
  const opc=(certa,pool)=>shuffle([certa,...shuffle(pool.filter(x=>x&&x!==certa)).slice(0,3)]);
  if(et.length>=2){qs.push({q:`Qual é a primeira etapa de “${p.nome}”?`,certa:et[0].desc,ops:opc(et[0].desc,et.map(e=>e.desc))})}
  for(let i=0;i<et.length-1&&qs.length<4;i++){if(i%2===0||et.length<5)qs.push({q:`O que vem logo depois de “${et[i].desc}”?`,certa:et[i+1].desc,ops:opc(et[i+1].desc,et.map(e=>e.desc).filter(d=>d!==et[i].desc))})}
  et.filter(e=>e.tipo==="decisao"&&e.seNao).forEach(e=>{qs.push({q:`Na pergunta “${e.desc}”, se a resposta for NÃO, o que fazer?`,certa:e.seNao,ops:opc(e.seNao,[...et.map(x=>x.desc),"Seguir para a próxima etapa normalmente","Encerrar o processo"])})});
  const cargos=[...new Set([p.cargoExecutor,p.reportaA,p.raci?.A,p.raci?.C,p.raci?.I,...et.map(e=>e.R),...pessoas().map(x=>x.cargo)].filter(Boolean))];
  const comR=et.filter(e=>e.R);if(comR.length&&cargos.length>=2){const e=comR[Math.floor(Math.random()*comR.length)];qs.push({q:`Quem realiza (R) a etapa “${e.desc}”?`,certa:e.R,ops:opc(e.R,cargos)})}
  if(p.reportaA&&cargos.length>=2)qs.push({q:`A quem o ${p.cargoExecutor||"executor"} reporta neste processo?`,certa:p.reportaA,ops:opc(p.reportaA,cargos)});
  if(p.raci?.A&&cargos.length>=2)qs.push({q:"Quem aprova (A) o resultado deste processo?",certa:p.raci.A,ops:opc(p.raci.A,cargos)});
  if(p.objetivo&&norm(p.objetivo)!==norm(p.nome)){const outros=processos().filter(x=>x.id!==p.id&&x.objetivo).map(x=>x.objetivo);if(outros.length)qs.push({q:"Qual é o objetivo deste processo?",certa:p.objetivo,ops:opc(p.objetivo,outros)})}
  return shuffle(qs).slice(0,6).map(x=>({...x,ops:x.ops.length<2?[x.certa,"Nenhuma das anteriores"]:x.ops}));
}

function telaSessaoTreino(){
  const s=state.treino;const t=D.treinamentos.find(x=>x.id===s.tid);if(!t){state.treino=null;return telaTreinamento()}
  const p=proc(t.processoId),x=pessoa(t.pessoaId);const et=(p.etapas||[]).filter(e=>e.desc);
  const topo=`<div class="row"><button class="btn ghost small" data-act="sair-treino">← Sair do treinamento</button></div>${head(`Treinamento · ${x?.nome||""}`,`${p.codigo||""} ${p.nome}`,`Versão ${p.versao} do POP`)}`;
  if(s.fase==="estudo"){
    if(!et.length)return topo+vazio("POP sem etapas","Edite o processo antes de treinar.");
    const e=et[s.i];const pct=Math.round((s.i+1)/et.length*100);
    return `${topo}<div class="study"><div class="progress" aria-label="Progresso"><i style="width:${pct}%"></i></div>
    <div class="study-card"><span class="eyebrow">Etapa ${s.i+1} de ${et.length} · ${e.tipo==="decisao"?"Decisão":"Ação"}</span><div class="big">${esc(e.desc)}</div>
    ${e.tipo==="decisao"&&e.seNao?`<div class="check"><b style="color:var(--red)">Se NÃO:</b> ${esc(e.seNao)}</div>`:""}
    <div class="row">${["R","A","C","I"].filter(l=>e[l]).map(l=>`<span class="pill" style="background:var(--surface-2)"><span class="dot d-${l}" style="width:18px;height:18px;font-size:10px">${l}</span>${esc(e[l])}</span>`).join("")||`<span class="muted small">Sem responsável marcado nesta etapa.</span>`}</div>
    ${s.i===0&&p.objetivo?`<p class="muted" style="margin:0">Objetivo do processo: ${esc(p.objetivo)}</p>`:""}</div>
    <div class="row" style="justify-content:space-between"><button class="btn" data-act="estudo-ant" ${s.i===0?"disabled":""}>← Anterior</button>${s.i<et.length-1?`<button class="btn green" data-act="estudo-prox">Próxima etapa →</button>`:`<button class="btn primary" data-act="iniciar-quiz">Fazer a avaliação</button>`}</div></div>`;
  }
  if(s.fase==="quiz"){
    if(!s.quiz.length)return `${topo}<div class="study-card"><div class="big">Este POP ainda tem poucas informações para gerar perguntas.</div><p>Confirme o treinamento prático com o líder.</p><div class="row"><button class="btn primary" data-act="confirmar-pratico">Confirmar treinamento prático</button></div></div>`;
    const q=s.quiz[s.q];const pct=Math.round(s.q/s.quiz.length*100);
    return `${topo}<div class="study"><div class="progress"><i style="width:${pct}%"></i></div><div class="study-card"><span class="eyebrow">Pergunta ${s.q+1} de ${s.quiz.length}</span><div class="big">${esc(q.q)}</div>
    <div style="display:flex;flex-direction:column;gap:8px">${q.ops.map((o,i)=>`<button class="quiz-opt${s.resp!=null?(o===q.certa?" right":(i===s.resp?" wrong":"")):""}" data-act="responder" data-id="${i}" ${s.resp!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${s.resp!=null?`<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="prox-pergunta">${s.q<s.quiz.length-1?"Próxima pergunta →":"Ver resultado"}</button></div>`:""}</div></div>`;
  }
  const ok=t.nota>=NOTA_MIN;
  return `${topo}<div class="study-card" style="border-color:${ok?"var(--brand)":"var(--red)"}"><span class="eyebrow">Resultado</span><div class="big">${ok?"Treinamento concluído":"Ainda não foi desta vez"}: ${t.nota}%</div>
  <p style="margin:0">${ok?`${esc(x?.nome)} está registrado como treinado na versão ${p.versao} de ${esc(p.codigo||p.nome)}.`:`São necessários ${NOTA_MIN}%. Revise as etapas e tente de novo.`}</p>
  <div class="row"><button class="btn" data-act="sair-treino">Voltar à matriz</button>${ok?"":`<button class="btn primary" data-act="treinar" data-id="${t.id}">Estudar de novo</button>`}<button class="btn ghost" data-act="abrir-processo" data-id="${p.id}">Abrir POP</button></div></div>`;
}

function buscar(q){
  const r=$("#resultados");q=norm(q);if(!q){r.hidden=true;return}
  const itens=[
    ...processos().map(p=>({t:`${p.codigo} · ${p.nome}`,s:"Processo",a:"abrir-processo",id:p.id,txt:p.codigo+" "+p.nome+" "+p.depto+" "+(p.etapas||[]).map(e=>e.desc).join(" ")})),
    ...pessoas().map(x=>({t:x.nome,s:"Pessoa · "+(x.cargo||""),a:"editar-pessoa",id:x.id,txt:x.nome+" "+x.cargo})),
    ...delegacoes().map(t=>({t:t.titulo,s:"Tarefa · "+t.responsavel,a:"editar-delegacao",id:t.id,txt:t.titulo+" "+t.responsavel})),
    ...decisoes().map(d=>({t:d.titulo,s:"Decisão · "+fmtData(d.data),a:"editar-decisao",id:d.id,txt:d.titulo+" "+d.descricao}))
  ].filter(i=>norm(i.txt).includes(q)).slice(0,10);
  r.innerHTML=itens.length?itens.map(i=>`<button data-act="${i.a}" data-id="${i.id}">${esc(i.t)}<br><small>${esc(i.s)}</small></button>`).join(""):`<div style="padding:10px 12px" class="muted">Nada encontrado para “${esc(q)}”.</div>`;
  r.hidden=false;
}

  "incluir-treino":(id,b)=>{const p=proc(id),x=pessoa(b.dataset.ind);garantirTreino(p,x);registrar("treinamento",`${x.nome} incluído no treinamento de ${p.codigo||p.nome}`);salvar_e_render()},
  "sair-treino":()=>{state.treino=null;render()},
  "estudo-prox":()=>{state.treino.i++;render()},
  "estudo-ant":()=>{state.treino.i=Math.max(0,state.treino.i-1);render()},
  "iniciar-quiz":()=>{const t=D.treinamentos.find(x=>x.id===state.treino.tid);Object.assign(state.treino,{fase:"quiz",quiz:gerarQuiz(proc(t.processoId)),q:0,acertos:0,resp:null});render()},
  "responder":id=>{const s=state.treino;if(s.resp!=null)return;s.resp=Number(id);const q=s.quiz[s.q];if(q.ops[s.resp]===q.certa)s.acertos++;render()},
  "prox-pergunta":()=>{const s=state.treino;if(s.q<s.quiz.length-1){s.q++;s.resp=null;render();return}
    const t=D.treinamentos.find(x=>x.id===s.tid);t.nota=Math.round(s.acertos/s.quiz.length*100);t.tentativas=(t.tentativas||0)+1;
    const x=pessoa(t.pessoaId),p=proc(t.processoId);registrar("treinamento",`${x?.nome} fez a avaliação de ${p.codigo||p.nome}: ${t.nota}%`);
    AUTO["treino.avaliado"](t);s.fase="resultado";salvar_e_render()},
  "confirmar-pratico":()=>{const s=state.treino;const t=D.treinamentos.find(x=>x.id===s.tid);t.nota=100;registrar("treinamento",`Treinamento prático confirmado: ${pessoa(t.pessoaId)?.nome}`);AUTO["treino.avaliado"](t);s.fase="resultado";salvar_e_render()}
};
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");if(nav){e.preventDefault();state.treino=null;ir(nav.dataset.nav);return}
  const b=e.target.closest("[data-act]");
  const menu=$("#menu-criar");
  if(e.target.closest("#b-criar")){const open=menu.hidden;menu.hidden=!open;$("#b-criar").setAttribute("aria-expanded",String(open));return}
  if(!e.target.closest(".menu"))menu.hidden=true;
  if(!e.target.closest(".search"))$("#resultados").hidden=true;
  if(!b)return;
  if(b.closest(".menu-list")){menu.hidden=true}
  if(b.closest("#resultados")){$("#resultados").hidden=true;$("#busca").value=""}
  let act=b.dataset.act;let id=b.dataset.id;
  if(act.startsWith("novo-indicador-")){id=act.slice(15);act="novo-indicador"}
  ACOES[act]?.(id,b);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="empresa"){if(el.value==="__novo"){el.value=E();formCliente();return}D.empresaAtual=el.value;state.filtroPessoa="";salvar();ir("painel");return}
  if(el.id==="flt-pessoa"){state.filtroPessoa=el.value;render();return}
  if(el.id==="flt-depto"){state.filtroDepto=el.value;render();return}
  if(el.id==="flt-fase"){state.filtroFase=el.value;render();return}
  if(el.id==="fase-sel"){const p=proc(el.dataset.id);const n=Number(el.value);if(n!==(p.fase??0)){registrar("processo",`${p.codigo||p.nome}: fase ${FASES[p.fase??0]} → ${FASES[n]}`);p.fase=n;salvar_e_render();toast("Fase atualizada.")}return}
  if(el.id==="add-treino"&&el.value){const p=proc(state.procId),x=pessoa(el.value);garantirTreino(p,x);registrar("treinamento",`${x.nome} incluído no treinamento de ${p.codigo||p.nome}`);salvar_e_render();return}
  if(el.dataset.auto){D.automacoes[el.dataset.auto].ativa=el.checked;salvar();toast(el.checked?"Automação ligada.":"Automação desligada.");if(el.checked&&AUTO.rotina())render();return}
  if(el.dataset.param){const v=Math.max(15,Number(el.value)||180);D.automacoes[el.dataset.param][el.dataset.nome]=v;salvar();toast("Intervalo salvo.");return}
  if(el.dataset.status){const t=D.delegacoes.find(x=>x.id===el.dataset.status);mudarStatus(t,el.value);return}
  if(el.closest("#ed")&&el.dataset.k==="tipo"){lerEditor();render();return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="busca"){buscar(e.target.value);return}
  if(e.target.closest("#ed")){clearTimeout(window._pv);window._pv=setTimeout(()=>{lerEditor();const pv=$("#prev-flow");if(pv)pv.innerHTML=fluxograma({etapas:state.editor.etapas.filter(s=>s.desc)})},250)}
});
document.addEventListener("submit",e=>{if(e.target.id==="ed"){e.preventDefault();salvarEditor()}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement?.tagName)&&!$("#dlg").open){e.preventDefault();$("#busca").focus()}
  if(e.key==="Escape"){$("#resultados").hidden=true;$("#menu-criar").hidden=true}
});
function mudarStatus(t,novo){
  if(!t||novo===(t.status||"afazer"))return;
  registrar("delegacao",`${t.titulo}: ${statusNome(t.status)} → ${statusNome(novo)} (${t.responsavel})`);
  t.status=novo;salvar_e_render();toast(`Movida para ${statusNome(novo)}.`);
}
/* Arrastar e soltar no quadro */
document.addEventListener("dragstart",e=>{const c=e.target.closest?.("[data-drag]");if(c){e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const c=e.target.closest?.("[data-col]");if(c){e.preventDefault();$$(".col.drop").forEach(x=>x!==c&&x.classList.remove("drop"));c.classList.add("drop")}});
document.addEventListener("dragleave",e=>{const c=e.target.closest?.("[data-col]");if(c&&!c.contains(e.relatedTarget))c.classList.remove("drop")});
document.addEventListener("drop",e=>{const c=e.target.closest?.("[data-col]");if(!c)return;e.preventDefault();c.classList.remove("drop");const t=D.delegacoes.find(x=>x.id===e.dataTransfer.getData("text/plain"));mudarStatus(t,c.dataset.col)});

/* Cópia de segurança */
$("#b-export").onclick=()=>{const blob=new Blob([JSON.stringify(D,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`genoma-processos-${hojeISO()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Cópia de segurança baixada.")};
$("#b-import").onclick=()=>$("#f-import").click();
$("#f-import").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.empresas||!j.processos)throw 0;D=j;salvar();ir("painel");toast("Cópia restaurada.")}catch(err){toast("Arquivo inválido. Use uma cópia gerada por este app.")}e.target.value=""};

/* Início */
carregar();
{const v=location.hash.slice(1);if(TELAS[v]&&v!=="processo"&&v!=="editor")state.view=v}
AUTO.rotina();
render();
setInterval(()=>{if(AUTO.rotina()&&!$("#dlg").open&&state.view!=="editor")render()},10*60*1000);
</script>
</body>
